apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-slack-bots
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: "{{ image }}"
  ingresses:
    - https://reops-slack-bots.ansatt.nav.no
  port: 9092
  liveness:
    path: /api/internal/isalive
    initialDelay: 30
  readiness:
    path: /api/internal/isready
    initialDelay: 5
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "50m"
      memory: 128Mi
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-custom-1-4096
        diskType: SSD
        diskSize: 10
        diskAutoresize: true
        autoBackupHour: 3
        databases:
          - name: slackbots
        maintenance:
          day: 1
          hour: 4
        cascadingDelete: false
  accessPolicy:
    outbound:
      external:
        # Slack Web API (slack.com/api) — chat.postMessage, conversations.history,
        # reactions.*, usergroups.users.list, chat.getPermalink
        - host: slack.com
        # Interactivity response_url webhooks (hooks.slack.com/actions/...)
        - host: hooks.slack.com
        # Team Catalog membership lookup for admin UI gating
        - host: teamkatalog-api.intern.nav.no
  envFrom:
    - secret: reops-slack-bots
  env:
    - name: ENVIRONMENT
      value: production
    - name: DATABASE_URL
      value: "$(NAIS_DATABASE_REOPS_SLACK_BOTS_SLACKBOTS_JDBC_URL)"
