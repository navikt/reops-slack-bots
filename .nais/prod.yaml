apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-slack-bots
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: "{{ image }}"
  ingresses:
    # Human-facing admin UI. ansatt.nav.no forces SSO at the platform level —
    # no exceptions possible — so machine webhooks can't live here.
    - https://reops.ansatt.nav.no
    # Machine-facing Slack webhook. Public internet, path-scoped to /api/slack
    # (covers interactivity, events, slash commands). Each route under it does
    # its own HMAC signature verification; everything else on this host 404s
    # via src/middleware.ts.
    - https://reops-slack-bots.nav.no/api/slack
  port: 9092
  liveness:
    path: /api/internal/isalive
    initialDelay: 30
  readiness:
    path: /api/internal/isready
    initialDelay: 5
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "50m"
      memory: 128Mi
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        # Slack webhooks land on the PUBLIC ingress (reops-slack-bots.nav.no)
        # because ansatt.nav.no has a separate platform-level SSO layer with
        # no exceptions. Wonderwall still runs on that ingress though, so we
        # must exempt the Slack paths here — otherwise it 401s the webhook
        # before it reaches the app. Routes under /api/slack/* do their own
        # HMAC-SHA256 signature verification (SLACK_SIGNING_SECRET).
        - /api/slack
        - /api/slack/**
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        tier: db-f1-micro
        diskType: SSD
        diskSize: 10
        diskAutoresize: true
        autoBackupHour: 3
        databases:
          - name: slackbots
        maintenance:
          day: 1
          hour: 4
        cascadingDelete: true
  accessPolicy:
    outbound:
      external:
        # Slack Web API (slack.com/api) — chat.postMessage, conversations.history,
        # reactions.read, users.lookupByEmail
        - host: slack.com
        # Team Catalog membership lookup for admin UI gating
        - host: teamkatalog-api.intern.nav.no
  envFrom:
    - secret: reops-slack-bots
  env:
    - name: ENVIRONMENT
      value: production
